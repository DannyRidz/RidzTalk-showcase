name: Check translation queue sample

on:
  push:
  pull_request:

jobs:
  sample:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run typecheck
